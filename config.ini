# custom-keypad 設定ファイル
#
# [hotkeys] セクションに「キー指定 = アクション名」を記述する。
#
# キー指定:
#   修飾キー Ctrl / Alt / Shift / Win を '+' でつなぎ、最後に通常キーを置く。
#   通常キー: A-Z, 0-9, F1-F24, OEM_MINUS, OEM_PLUS, OEM_7, OEM_5,
#             SPACE, ENTER, TAB, ESC, LEFT/UP/RIGHT/DOWN など。
#   例: Ctrl+Alt+M / Alt+OEM_MINUS / Alt+P
#
# アクション名:
#   app.toggle_hotkeys ... ホットキー全体の有効/無効トグル（マスター）
#   switcher.toggle    ... ウィンドウ切替パネルの表示/更新
#   switcher.left      ... 選択を左へ（フォーカス移動）
#   switcher.right     ... 選択を右へ（フォーカス移動）
#   switcher.pin       ... 選択ウィンドウを最前面に固定/解除（トグル）
#
# このファイルが無い／空の場合は以下と同じデフォルトが使われる。
# 不正なキー指定・未登録アクションの行は無視される。

[hotkeys]
Ctrl+Alt+M    = app.toggle_hotkeys
Alt+OEM_MINUS = switcher.toggle
Alt+OEM_7     = switcher.left
Alt+OEM_5     = switcher.right
Alt+P         = switcher.pin
